<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with luxury gradient -->
  <rect width="512" height="512" fill="#1A1A1A" rx="102"/>
  <rect width="512" height="512" fill="url(#gradient)" rx="102"/>

  <!-- Gold border -->
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#D4AF37" stroke-width="4" rx="98"/>

  <!-- Main logo/icon -->
  <g transform="translate(128, 128)">
    <!-- Diamond/Crown icon representing luxury -->
    <path d="M128 64L160 128H96L128 64Z" fill="#D4AF37"/>
    <path d="M96 128L128 192L160 128H96Z" fill="#E6C756"/>
    <path d="M64 96L96 128L64 160L32 128L64 96Z" fill="#D4AF37"/>
    <path d="M192 96L224 128L192 160L160 128L192 96Z" fill="#D4AF37"/>

    <!-- Text "HG" for Hills Guide -->
    <text x="128" y="240" text-anchor="middle" fill="#D4AF37" font-family="serif" font-size="48" font-weight="bold">HG</text>
  </g>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>