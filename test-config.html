<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Dynamic Configuration System Test</h1>
    <div id="test-results"></div>

    <script>
        const testResults = document.getElementById('test-results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            testResults.appendChild(div);
        }

        async function testConfiguration() {
            addResult('🚀 Starting configuration system tests...', 'info');

            try {
                // Test 1: Load app-config.json
                addResult('📋 Testing app-config.json...', 'info');
                const appConfigResponse = await fetch('/config/app-config.json');

                if (!appConfigResponse.ok) {
                    throw new Error(`App config failed: ${appConfigResponse.status}`);
                }

                const appConfig = await appConfigResponse.json();
                addResult(`✅ App config loaded successfully: ${appConfig.app.name}`, 'success');
                addResult(`<pre>${JSON.stringify(appConfig.app, null, 2)}</pre>`, 'info');

                // Test 2: Load Greenville businesses
                addResult('🏢 Testing Greenville businesses.json...', 'info');
                const businessesResponse = await fetch('/config/locations/greenville/businesses.json');

                if (!businessesResponse.ok) {
                    throw new Error(`Greenville businesses failed: ${businessesResponse.status}`);
                }

                const businessesData = await businessesResponse.json();
                addResult(`✅ Greenville businesses loaded: ${businessesData.businesses.length} businesses`, 'success');
                addResult(`<pre>Sample business: ${JSON.stringify(businessesData.businesses[0], null, 2)}</pre>`, 'info');

                // Test 3: Load Greenville events
                addResult('📅 Testing Greenville events.json...', 'info');
                const eventsResponse = await fetch('/config/locations/greenville/events.json');

                if (!eventsResponse.ok) {
                    throw new Error(`Greenville events failed: ${eventsResponse.status}`);
                }

                const eventsData = await eventsResponse.json();
                addResult(`✅ Greenville events loaded: ${eventsData.events.length} events`, 'success');

                // Test 4: Load Charleston businesses (multi-location test)
                addResult('🌊 Testing Charleston businesses.json (multi-location)...', 'info');
                const charlestonResponse = await fetch('/config/locations/charleston/businesses.json');

                if (!charlestonResponse.ok) {
                    throw new Error(`Charleston businesses failed: ${charlestonResponse.status}`);
                }

                const charlestonData = await charlestonResponse.json();
                addResult(`✅ Charleston businesses loaded: ${charlestonData.businesses.length} businesses`, 'success');
                addResult(`<pre>Charleston sample: ${JSON.stringify(charlestonData.businesses[0], null, 2)}</pre>`, 'info');

                // Test 5: Verify configuration structure
                addResult('🔍 Verifying configuration structure...', 'info');
                const requiredAppFields = ['name', 'tagline', 'description', 'location'];
                const missingFields = requiredAppFields.filter(field => !appConfig.app[field]);

                if (missingFields.length > 0) {
                    throw new Error(`Missing app fields: ${missingFields.join(', ')}`);
                }

                addResult('✅ All required app configuration fields present', 'success');

                // Test 6: Verify navigation categories
                const categories = appConfig.navigation.categories;
                addResult(`✅ Navigation categories: ${categories.length} categories found`, 'success');

                const featuredCategories = categories.filter(cat => cat.featured);
                addResult(`✅ Featured categories: ${featuredCategories.length} categories`, 'success');

                addResult('🎉 All configuration tests passed! The dynamic system is working correctly.', 'success');

            } catch (error) {
                addResult(`❌ Configuration test failed: ${error.message}`, 'error');
                console.error('Configuration test error:', error);
            }
        }

        // Run tests when page loads
        testConfiguration();
    </script>
</body>
</html>
