<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOZ" />
    
    <!-- Enhanced SEO Meta Tags -->
    <meta name="description" content="FLOZ - Your complete guide to the Lake of the Ozarks. Discover local businesses, live events, dining, marinas, and entertainment. The ultimate Lake of the Ozarks business directory." />
    <meta name="keywords" content="Lake of the Ozarks, LOZ, local businesses, dining restaurants, live events, marinas, entertainment, Missouri lake, Osage Beach, Camdenton, boat rentals, lake real estate, vacation guide" />
    <meta name="author" content="FLOZ App" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://floz.app" />

    <!-- Enhanced Open Graph Meta Tags -->
    <meta property="og:title" content="FLOZ - Your Complete Lake of the Ozarks Guide" />
    <meta property="og:description" content="Discover the best businesses, events, dining, and entertainment at Lake of the Ozarks. Your ultimate LOZ companion app." />
    <meta property="og:image" content="/images/floz-og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://floz.app" />
    <meta property="og:site_name" content="FLOZ" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FLOZ - Your Complete Lake of the Ozarks Guide" />
    <meta name="twitter:description" content="Discover the best businesses, events, dining, and entertainment at Lake of the Ozarks." />
    <meta name="twitter:image" content="/images/floz-twitter-card.jpg" />
    <meta name="twitter:creator" content="@FlozApp" />

    <!-- Geo Location Meta Tags -->
    <meta name="geo.region" content="US-MO" />
    <meta name="geo.placename" content="Lake of the Ozarks, Missouri" />
    <meta name="geo.position" content="38.0756;-92.6074" />
    <meta name="ICBM" content="38.0756, -92.6074" />

    <!-- Structured Data - JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FLOZ",
      "description": "Your complete guide to the Lake of the Ozarks. Discover local businesses, live events, dining, and entertainment.",
      "url": "https://floz.app",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "FLOZ",
        "url": "https://floz.app"
      },
      "about": {
        "@type": "Place",
        "name": "Lake of the Ozarks",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Missouri",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "38.0756",
          "longitude": "-92.6074"
        }
      }
    }
    </script>
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <title>FLOZ - Your Lake Guide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- PWA Install Prompt Handler -->
    <script>
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.deferredPrompt = deferredPrompt;
      });
      
      window.addEventListener('appinstalled', () => {
        console.log('FLOZ app was installed');
        deferredPrompt = null;
        window.deferredPrompt = null;
      });
    </script>
  </body>
</html>
