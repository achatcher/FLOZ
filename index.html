<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOZ" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="FLOZ - Your complete guide to the Lake of the Ozarks. Discover businesses, events, dining, and more!" />
    <meta name="keywords" content="Lake of the Ozarks, local businesses, dining, events, marinas" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="FLOZ - Your Lake Guide" />
    <meta property="og:description" content="Your complete guide to the Lake of the Ozarks" />
    <meta property="og:image" content="/images/floz-og-image.jpg" />
    <meta property="og:type" content="website" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <title>FLOZ - Your Lake Guide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- PWA Install Prompt Handler -->
    <script>
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.deferredPrompt = deferredPrompt;
      });
      
      window.addEventListener('appinstalled', () => {
        console.log('FLOZ app was installed');
        deferredPrompt = null;
        window.deferredPrompt = null;
      });
    </script>
  </body>
</html>
